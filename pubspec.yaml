name: masterdesk
description: Offline repair workshop manager by NEXVIRO.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: 1.0.8
  sqflite: 2.4.1
  path: 1.9.1
  path_provider: 2.1.5
  image_picker: 1.1.2
  file_picker: 8.1.7
  pdf: 3.11.1
  printing: 5.14.0
  share_plus: 10.1.4
  uuid: 4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/DejaVuSans.ttf
    - assets/fonts/DejaVuSans-Bold.ttf
    - assets/images/masterdesk_icon.png
    - assets/images/masterdesk_icon_512.png

  fonts:
    - family: DejaVuSans
      fonts:
        - asset: assets/fonts/DejaVuSans.ttf
        - asset: assets/fonts/DejaVuSans-Bold.ttf
          weight: 700

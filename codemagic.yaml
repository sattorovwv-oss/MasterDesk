workflows:
  masterdesk-android-release:
    name: MasterDesk Android Release
    max_build_duration: 60
    environment:
      flutter: 3.47.2
      java: 17
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
